<!DOCTYPE html>
<html lang="th">
<head>

<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:400 17px/1.55 "Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:#17332b}

.sunb{position:absolute;top:6%;right:8%;font-size:80px}

.mc{display:block;width:100%;text-align:left;border:0;border-radius:24px;padding:0;margin:14px 0;overflow:hidden;color:#fff;box-shadow:0 6px 0 #0003}

.mc .d{padding:12px 18px;background:#0000002e}.mc b{font:700 24px Mali}
.mc[disabled]{filter:grayscale(.8);opacity:.7;cursor:not-allowed}

.owl{background:#fff8d6;color:#17332b;padding:6px 12px;font-size:15px;z-index:3;border-bottom:2px solid #f0dc7a}
.sc{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;align-items:flex-end;position:relative;-webkit-overflow-scrolling:touch;background-size:cover;background-position:center}.stg{will-change:transform}
.stg{position:relative;width:1800px;height:460px;flex:none}
.far{position:absolute;left:0;bottom:90px;width:1800px;height:200px;will-change:transform}
.far i{position:absolute;bottom:0;border-radius:50% 50% 0 0;opacity:.7}
.gnd{position:absolute;left:0;right:0;bottom:0;height:110px}
.wat{position:absolute;left:0;right:0;bottom:0;height:44px;background:#3b9de0aa}
.en{position:absolute;z-index:2;background:none;border:0;padding:0;min-height:0;line-height:1;cursor:pointer;transition:transform .5s,opacity .5s,filter .5s;border-radius:50%}
.en.an{animation:fl 4s ease-in-out infinite}

.en.env-wilt{transform:rotate(12deg) scale(.78);filter:grayscale(.45) saturate(.6)}.en.env-stress{opacity:.35;filter:grayscale(.6)}

@media(max-width:520px){.tb button{font-size:12px;padding:4px 1px}.envrow{grid-template-columns:92px 1fr 30px;font-size:13px}.sh{max-height:65%}}
svg.ov{position:absolute;inset:0;pointer-events:none}

.sh{position:absolute;left:8px;right:8px;bottom:72px;max-height:58%;overflow:auto;background:var(--card);border:3px solid var(--leaf);border-radius:20px;padding:14px;z-index:5;box-shadow:0 8px 30px #0005}
.tg{display:inline-block;border-radius:10px;padding:0 10px;font-size:14px;font-weight:600;color:#fff;background:var(--leaf)}
.sh .o{display:block;width:100%;text-align:left;margin:6px 0}
.ok{border-color:var(--leaf)!important;background:#2a9d6a30!important}.no{border-color:var(--red)!important;background:#e8534a26!important}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#17332b;color:#fff;padding:8px 20px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
.cld{position:absolute;left:-120px;font-size:80px;opacity:.85;animation:dr linear infinite;pointer-events:none}@keyframes dr{to{left:1900px}}#sn{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;width:46px;padding:0;border-radius:50%}.top{padding-right:64px}.en{filter:drop-shadow(0 4px 3px #0003)}
@media (prefers-reduced-motion:reduce){.fl,.en.an,.cld{animation:none}*{transition:none!important}}
</style>
</head>

function stars(m){return [1,2,3,4,5].filter(function(q){return S['m'+m+'q'+q]}).length}
function tot(){return Object.keys(S).filter(function(k){return /^m\d+q\d$/.test(k)}).length}
function sh(a){return a.map(function(x){return[Math.random(),x]}).sort(function(p,q){return p[0]-q[0]}).map(function(p){return p[1]})}
